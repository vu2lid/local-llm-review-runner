[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-review-runner"
version = "0.1.0"
description = "Offline command-line runner that classifies structured candidate-review tasks with local LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vu2lid" }]
dependencies = []

[project.scripts]
local-llm-review = "local_llm_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_llm_review = ["prompts/*.txt"]
